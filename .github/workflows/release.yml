name: Release

# Releases are cut by hand: write changesets (`pnpm changeset`), merge them, then
# `gh workflow run release.yml --ref main`. One run versions and publishes both packages:
# @e2b/claude-toolsets to npm and e2b-claude-toolsets to PyPI, both over OIDC trusted
# publishing (no tokens). Both registries trust this file and the `deployment` environment.
on:
  workflow_dispatch: {}

concurrency: release-${{ github.ref }}

permissions:
  contents: read

jobs:
  preflight:
    name: Release preflight
    runs-on: ubuntu-latest
    outputs:
      release: ${{ steps.version.outputs.release }}
    steps:
      - name: Check the ref
        # `workflow_dispatch` offers every branch in the picker, and a feature branch
        # carrying changesets would otherwise publish real packages from that branch.
        if: github.ref != 'refs/heads/main'
        env:
          REF: ${{ github.ref }}
        run: |
          echo "::error::Releases must run on main; this run is on ${REF}."
          exit 1

      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0

      - name: Check for pending changesets
        id: version
        run: echo "release=$(./.github/scripts/is_release.sh)" >> "$GITHUB_OUTPUT"

  test:
    name: Build and test
    needs: preflight
    if: needs.preflight.outputs.release == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: '3.13'
          enable-cache: true

      - run: pnpm install --frozen-lockfile

      - run: uv sync --frozen
        working-directory: packages/claude-toolsets-python

      - run: pnpm --filter @e2b/claude-toolsets-runtime exec playwright install --with-deps chromium --only-shell

      - run: pnpm check

      - run: pnpm test:all

  publish:
    name: Version and publish
    needs: [preflight, test]
    if: needs.preflight.outputs.release == 'true'
    runs-on: ubuntu-latest
    # Both trusted publishers (npm and PyPI) are pinned to this environment, and its
    # deployment branch policy only allows main.
    environment: deployment
    permissions:
      contents: write
      id-token: write
    steps:
      - uses: actions/create-github-app-token@d72941d797fd3113feb6b93fd0dec494b13a2547 # v1.12.0
        id: app-token
        with:
          app-id: ${{ vars.VERSION_BUMPER_APPID }}
          private-key: ${{ secrets.VERSION_BUMPER_SECRET }}

      - uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
        with:
          token: ${{ steps.app-token.outputs.token }}

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: 22
          registry-url: 'https://registry.npmjs.org'
          cache: pnpm

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.3.14

      - uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e # v6.8.0
        with:
          python-version: '3.13'
          enable-cache: true

      - name: Update npm
        # npm trusted publishing needs npm 11.5.1 or newer.
        run: |
          npm install -g npm@^11.6
          npm --version

      - run: pnpm install --frozen-lockfile

      - run: uv sync --frozen
        working-directory: packages/claude-toolsets-python

      - name: No local dependencies
        # A file: or link: dependency would publish a local path (for example vendor/) in
        # package.json or the Python sdist, and nothing outside this repo could install it.
        run: |
          if grep -nE '"(file|link):' package.json packages/*/package.json || grep -n 'vendor/' packages/claude-toolsets-python/pyproject.toml; then
            echo "::error::Local dependency paths found; point them at published versions before releasing."
            exit 1
          fi

      - name: Create new versions
        run: pnpm run version

      - name: Commit new versions
        id: commit
        # Commit before publishing, because `changeset publish` tags whatever HEAD it
        # publishes from.
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # `add -A`: `changeset version` writes each CHANGELOG.md as a new file the first time.
          git add -A
          if git diff --cached --quiet; then
            echo "::error::'changeset version' produced no changes, so there is nothing to publish or tag."
            exit 1
          fi
          git commit -m "[skip ci] Release new versions"

      - name: Publish
        id: release
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1.9.0
        with:
          publish: pnpm run release
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push new versions
        # Keep the version bump even after a partial publish, so a later release cannot
        # reuse a version that one registry already has.
        if: always() && steps.commit.outcome == 'success' && steps.release.outcome != 'skipped'
        run: |
          if ! git push; then
            git fetch origin "${GITHUB_REF_NAME}"
            git merge --no-edit FETCH_HEAD
            git push
          fi
